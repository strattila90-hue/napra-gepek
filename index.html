<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6E0B13">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Napra Gépek">
<title>N(app)ra Gépek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap&subset=latin-ext">
<style>
/* Layout: tüzér-vörös, lekerekített app. Felül sáv (medve-jelvény), középen oldalra lapozható típus-oldalak (Összesítő díszszemle + 6 típus), alul fix menü. Háttérben halvány Szent Borbála. */
:root{
  --bg:#F3EFEF; --surface:#FFFFFF; --surface2:#F7EDEE; --fg:#1E1416; --muted:#6F5E61; --line:#E6D7D9;
  --accent:#B0121E; --accent-deep:#6E0B13; --accent-fg:#FFFFFF; --brass:#A87A22;
  --hero1:#6E0B13; --hero2:#B0121E; --hero-fg:#FFF3F1;
  --ok:#23773A; --ok-bg:#DDF0E1; --warn:#9A6206; --warn-bg:#FBEBC9; --bad:#B0121E; --bad-bg:#FADADC; --svc:#4F5E70; --svc-bg:#E1E7EE;
  --c1:#2F6E9A; --c2:#B0121E; --c3:#6A4FA8; --c4:#23773A; --c5:#9A6206; --c6:#3F7A70; --c7:#6F6667;
  --saint:#B0121E; --rubber:#2B2627; --rubber-edge:#4A4244; --wood:#C79A5B; --wood-dark:#9C7440;
  --f-display:"Anton","Impact","Arial Narrow",sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:20px; --navh:66px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#150C0E; --surface:#201517; --surface2:#2A1A1D; --fg:#F5EAEB; --muted:#B9A2A6; --line:#3B262A;
  --accent:#E8424E; --accent-deep:#8F1520; --accent-fg:#FFFFFF; --brass:#E2B45C;
  --hero1:#4E0810; --hero2:#951420; --hero-fg:#FFF3F1;
  --ok:#7BD08E; --ok-bg:#1C3424; --warn:#F2C062; --warn-bg:#3B2C12; --bad:#FF7B84; --bad-bg:#47191D; --svc:#A9BACD; --svc-bg:#25303C;
  --c1:#7FB7DE; --c2:#FF7B84; --c3:#B7A3EE; --c4:#7BD08E; --c5:#F2C062; --c6:#8FC6BB; --c7:#B9B0B1; --saint:#E8424E; --rubber:#0E0B0C; --rubber-edge:#5A5052; --wood:#B98C52; --wood-dark:#8A6638; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150C0E; --surface:#201517; --surface2:#2A1A1D; --fg:#F5EAEB; --muted:#B9A2A6; --line:#3B262A;
  --accent:#E8424E; --accent-deep:#8F1520; --accent-fg:#FFFFFF; --brass:#E2B45C;
  --hero1:#4E0810; --hero2:#951420; --hero-fg:#FFF3F1;
  --ok:#7BD08E; --ok-bg:#1C3424; --warn:#F2C062; --warn-bg:#3B2C12; --bad:#FF7B84; --bad-bg:#47191D; --svc:#A9BACD; --svc-bg:#25303C;
  --c1:#7FB7DE; --c2:#FF7B84; --c3:#B7A3EE; --c4:#7BD08E; --c5:#F2C062; --c6:#8FC6BB; --c7:#B9B0B1; --saint:#E8424E; --rubber:#0E0B0C; --rubber-edge:#5A5052; --wood:#B98C52; --wood-dark:#8A6638; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.muted{color:var(--muted)} .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lbl{font-weight:700;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.saint{position:fixed;right:-4vw;bottom:calc(var(--navh) - 10px);height:78vh;width:auto;max-width:70vw;color:var(--saint);opacity:.055;pointer-events:none;z-index:0}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(100deg,var(--hero1),var(--hero2));color:var(--hero-fg);padding:10px 16px;display:flex;align-items:center;gap:12px;border-radius:0 0 22px 22px;box-shadow:0 6px 18px rgba(80,0,10,.18)}
.topbar .badge-bear{width:42px;height:42px;flex:none}
.topbar .brand{font-family:var(--f-display);font-size:24px;letter-spacing:.03em;line-height:1}
.topbar .sub{font-size:12px;opacity:.8;font-weight:600;letter-spacing:.04em}
.topbar .tools{margin-left:auto;display:flex;gap:6px;align-items:center}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1.5px solid rgba(255,243,241,.45);background:transparent;color:inherit;cursor:pointer;display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
#snd{width:46px;height:46px;background:rgba(255,255,255,.16);border:2px solid rgba(255,243,241,.7);box-shadow:0 2px 10px rgba(0,0,0,.18)}
#snd svg.gearic{width:30px;height:30px;stroke:none}
@media (prefers-reduced-motion:no-preference){#snd:active svg{transform:rotate(60deg);transition:transform .25s}}
.mode{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.8;white-space:nowrap}
.page{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:14px calc(var(--navh) + 34px)}
.banner{margin-bottom:12px;padding:9px 14px;background:var(--warn-bg);color:var(--warn);font-size:14px;border-radius:14px;font-weight:600}
nav.bottom{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;justify-content:center}
nav.bottom .in{display:flex;width:100%;max-width:560px;background:var(--surface);border-radius:24px;box-shadow:0 8px 28px rgba(60,0,8,.22);border:1px solid var(--line);padding:4px}
nav.bottom button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px;cursor:pointer;color:var(--muted);font-weight:700;font-size:11px;letter-spacing:.03em;position:relative;min-width:0;border-radius:20px}
nav.bottom svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9}
nav.bottom button[aria-current="page"]{color:var(--accent-fg);background:var(--accent)}
nav.bottom .cnt{position:absolute;top:2px;left:calc(50% + 8px);background:var(--brass);color:var(--surface);font-family:var(--f-mono);font-size:10px;border-radius:8px;padding:0 5px;line-height:16px}
.btn{border:0;background:var(--surface2);color:var(--fg);padding:10px 18px;border-radius:999px;cursor:pointer;font-weight:700;font-size:14.5px;white-space:nowrap}
.btn.pri{background:var(--accent);color:var(--accent-fg)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.line{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{min-height:70px;resize:vertical}
.pill{font-size:12.5px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap;line-height:1.6}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.svc{background:var(--svc-bg);color:var(--svc)}
.pills{display:flex;gap:5px;flex-wrap:wrap}
.panel{background:var(--surface);border-radius:var(--r);padding:16px 18px;min-width:0;box-shadow:0 1px 0 var(--line),0 4px 16px rgba(60,0,8,.05)}
.panel>h3{font-weight:800;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
@media (max-width:420px){.cols{grid-template-columns:1fr}}
.empty{padding:18px;border:2px dashed var(--line);border-radius:16px;color:var(--muted);text-align:center;font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--f-mono);overflow-wrap:anywhere}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.r{text-align:right} td.mono{white-space:nowrap}
tr.hl td{background:var(--surface2);font-weight:700}
.list{display:flex;flex-direction:column;gap:8px}
.item{border-radius:14px;padding:11px 13px;display:flex;gap:10px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;background:var(--surface2)}
.item .main{min-width:0;flex:1 1 200px} .item .t{font-weight:700}
.hint{font-size:13px;color:var(--muted)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.thumbs button{border:0;padding:0;background:var(--line);border-radius:10px;cursor:pointer;width:60px;height:60px;overflow:hidden}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 13px;font-weight:700;cursor:pointer;font-size:13px;border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;margin-right:5px}

/* ===== lapozó fülsor + sín ===== */
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 10px}
.tabs button{border:0;background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:800;font-size:13.5px;cursor:pointer;white-space:nowrap;box-shadow:inset 0 0 0 1.5px var(--line);display:flex;align-items:center;gap:6px}
.tabs button .n{font-family:var(--f-mono);font-size:12px;opacity:.75}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);box-shadow:none}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;gap:0;overscroll-behavior-x:contain;align-items:flex-start}
.track::-webkit-scrollbar{display:none}
.pg{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;min-width:0;padding:0 2px}
.dots{display:flex;justify-content:center;gap:6px;margin:12px 0 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent);width:20px;border-radius:4px}

/* ===== díszszemle (összesítő) ===== */
.parade{position:relative;border-radius:26px;overflow:hidden;background:linear-gradient(160deg,var(--hero1),var(--hero2));color:var(--hero-fg);padding:20px 18px 18px}
.parade .bearbig{position:absolute;right:-30px;top:-20px;width:230px;opacity:.13;pointer-events:none}
.parade h2{font-family:var(--f-display);font-size:clamp(30px,7vw,46px);letter-spacing:.02em;line-height:1;font-weight:400}
.parade .kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0 18px;position:relative}
.parade .kpi{background:rgba(255,255,255,.1);border-radius:16px;padding:10px 12px}
.parade .kpi b{display:block;font-family:var(--f-display);font-size:34px;font-weight:400;line-height:1.05}
.parade .kpi span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.ready{height:10px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden;display:flex;margin-bottom:16px}
.ready i{display:block;height:100%}
.ranks{display:flex;flex-direction:column;gap:6px;position:relative}
.rank{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:end;padding-bottom:6px;border-bottom:2px solid rgba(255,243,241,.18);cursor:pointer;background:none;border-top:0;border-left:0;border-right:0;color:inherit;text-align:left}
.rank .nm{font-weight:800;font-size:13px;line-height:1.15}
.rank .nm b{display:block;font-family:var(--f-display);font-size:28px;font-weight:400;line-height:1}
.rank .units{display:flex;flex-wrap:wrap;gap:2px 4px;align-items:flex-end;min-height:30px}
.unit{position:relative;width:58px;color:var(--hero-fg)}
.unit svg{width:100%;height:auto;display:block}
.unit.limited{color:var(--brass)}
.unit.service{color:rgba(255,243,241,.32)}
.unit.empty{color:transparent}
.unit.empty svg *{stroke:rgba(255,243,241,.35);stroke-dasharray:3 3;fill:none}
.unit .wr{position:absolute;right:-2px;top:-6px;width:17px;height:17px;border-radius:50%;background:var(--svc-bg);color:var(--svc);display:grid;place-items:center}
.unit .wr svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.6}
@media (prefers-reduced-motion:no-preference){.unit{animation:rollin .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 45ms)}@keyframes rollin{from{transform:translateX(-26px);opacity:0}to{transform:none;opacity:1}}}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;font-weight:600;margin-top:12px;opacity:.9;position:relative}

/* ===== típus-oldal ===== */
.typehead{border-radius:26px;background:linear-gradient(150deg,var(--hero1),var(--hero2));color:var(--hero-fg);padding:18px;position:relative;overflow:hidden}
.typehead .sil{width:min(300px,70%);color:var(--hero-fg);opacity:.95;margin:4px 0 0 auto;display:block}
.typehead .sil svg{width:100%;height:auto;display:block}
.typehead h2{font-family:var(--f-display);font-size:clamp(34px,9vw,54px);font-weight:400;line-height:1;letter-spacing:.02em}
.typehead .meta{font-size:13px;opacity:.85;font-weight:600;margin-top:4px}
.counter{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.counter .big{font-family:var(--f-display);font-size:52px;line-height:1;min-width:2ch;text-align:center}
.counter button{width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:var(--hero-fg);font-size:26px;font-weight:700;cursor:pointer;display:grid;place-items:center}
.counter button.plus{background:var(--hero-fg);color:var(--accent-deep)}
.counter .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.readyrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.readyrow span{background:rgba(255,255,255,.14);border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:700}
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:14px}
@media (max-width:420px){.vlist{grid-template-columns:1fr}}
.vcard{background:var(--surface);border-radius:var(--r);padding:14px 14px 14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;box-shadow:0 1px 0 var(--line),0 4px 16px rgba(60,0,8,.05);position:relative;cursor:pointer;border:0;text-align:left;color:inherit;width:100%}
.vcard::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:5px;border-radius:0 5px 5px 0;background:var(--ok)}
.vcard.limited::before{background:var(--warn)} .vcard.service::before{background:var(--svc)}
.vcard .reg{font-family:var(--f-display);font-size:30px;line-height:1;letter-spacing:.03em;overflow-wrap:anywhere;font-weight:400}
.vcard .reg.blank{color:var(--muted);font-family:var(--f-body);font-weight:800;font-size:17px;line-height:1.3}
.vcard .line{grid-column:1/-1;display:flex;gap:4px 14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.vcard .line b{color:var(--fg);font-weight:700}
.vcard .pills{grid-column:1/-1}
.stbtn{border:0;border-radius:14px;padding:6px 10px;cursor:pointer;display:flex;align-items:center;gap:6px;font-weight:800;font-size:12px;letter-spacing:.02em;align-self:start}
.stbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2}
.stbtn.ok{background:var(--ok-bg);color:var(--ok)} .stbtn.limited{background:var(--warn-bg);color:var(--warn)} .stbtn.service{background:var(--svc-bg);color:var(--svc)}
.addcard{border:2px dashed var(--line);border-radius:var(--r);background:transparent;cursor:pointer;color:var(--muted);font-weight:800;min-height:96px;display:flex;align-items:center;justify-content:center;gap:8px}

/* ===== gép-lap ===== */
.vtop{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.vtop .back{border:0;background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:800;cursor:pointer;box-shadow:inset 0 0 0 1.5px var(--line)}
.vtop .arrow{width:42px;height:42px;border-radius:50%;border:0;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);cursor:pointer;font-size:22px;line-height:1;flex:none}
.vtop .arrow:disabled{opacity:.35;cursor:default}
.vtop .pos{margin-left:auto;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.hero{border-radius:26px;background:linear-gradient(150deg,var(--hero1),var(--hero2));color:var(--hero-fg);overflow:hidden;position:relative;touch-action:pan-y;user-select:none;padding:18px}
.hero .reg{font-family:var(--f-display);font-size:clamp(46px,13vw,80px);line-height:.95;letter-spacing:.03em;overflow-wrap:anywhere;font-weight:400}
.hero .tt{font-weight:700;opacity:.85;font-size:14px}
.hero .sil{width:min(320px,78%);margin:6px 0 0 auto;display:block;color:var(--hero-fg)}
.hero .sil svg{width:100%;height:auto;display:block}
.hero .facts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.hero .facts span{background:rgba(255,255,255,.14);border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600}
.hero .stbig{position:absolute;top:16px;right:16px}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
.quick button{border:0;background:var(--surface);border-radius:18px;padding:12px 4px;cursor:pointer;font-weight:800;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;box-shadow:0 1px 0 var(--line),0 4px 14px rgba(60,0,8,.05)}
.quick svg{width:24px;height:24px;stroke:var(--accent);fill:none;stroke-width:1.9}
.subtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px;padding-bottom:2px}
.subtabs button{border:0;background:transparent;border-radius:999px;padding:7px 13px;font-weight:800;font-size:13.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.subtabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.metric{background:var(--surface);border-radius:16px;padding:10px 12px;box-shadow:0 1px 0 var(--line)}
.metric .v{font-family:var(--f-mono);font-size:20px;font-weight:600}
.metric .v small{font-size:11px;color:var(--muted);font-weight:400;margin-left:3px}
.mlbox{border-radius:16px;padding:14px;background:var(--surface2)}
.mlbox .n{font-family:var(--f-display);font-size:34px;line-height:1;font-weight:400}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.ref{font-size:13px;color:var(--muted);border-left:3px solid var(--brass);padding-left:10px;margin-top:10px}
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.timeline li{position:relative;padding:0 0 12px 26px}
.timeline li::before{content:"";position:absolute;left:1px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--muted)}
.timeline li.fuel::before{border-color:var(--k)} .timeline li.move::before{border-color:var(--accent)}
.timeline .d{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
/* naptár */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-weight:800;font-size:11px;text-align:center;letter-spacing:.06em;color:var(--muted);padding:2px 0}

.cal .day.out{background:transparent;color:var(--muted)}
.cal .day .n{font-family:var(--f-mono);font-size:12px;font-weight:600}
.cal .day.today .n{background:var(--accent);color:var(--accent-fg);border-radius:6px;padding:0 5px;align-self:flex-start}
.cal .day[aria-pressed="true"]{box-shadow:inset 0 0 0 2.5px var(--accent)}
.cal .ev{font-size:10.5px;line-height:1.35;padding:0 5px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.cal .ev.place{background:var(--surface2);box-shadow:inset 0 0 0 1px var(--accent)}
.cal .ev.fuel{color:var(--surface);background:var(--k)}
.cal .ev.ml{color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.cal .more{font-size:10px;color:var(--muted);font-family:var(--f-mono)}
@media (max-width:560px){.cal{gap:2px}.cal .day{min-height:56px;border-radius:9px;padding:4px}.cal .ev{font-size:0;height:5px;padding:0;box-shadow:none}.cal .ev.place{background:var(--accent)}.cal .ev.ml{display:none}}

.fstpick span{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--surface2);font-weight:800;font-size:14px;box-shadow:inset 0 0 0 1.5px var(--line)}

.fstpick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.rqd{border-radius:12px;background:var(--surface2)}
.rqd summary{cursor:pointer;padding:8px 12px;font-weight:800;list-style:none;display:flex;align-items:center;gap:6px}

.rqd summary::before{content:'▸';transition:transform .2s;display:inline-block}.rqd[open] summary::before{transform:rotate(90deg)}

.rqtl li{position:relative;padding-left:20px;color:var(--muted)}

.rqtl li.on{color:var(--fg)}.rqtl li.on::before{border-color:var(--accent);background:var(--accent)}

.rchip{font-size:10.5px;font-weight:800;padding:0 7px;border-radius:99px;background:rgba(127,127,127,.18);line-height:1.6}

.chatin svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.setg{border-top:1px dashed var(--line);padding:12px 0 4px}.setg:first-child{border-top:0;padding-top:0}

let AC=null,NOISE=null,MASTER=null;
function ac(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();MASTER=AC.createGain();MASTER.gain.value=SET.vol/100;MASTER.connect(AC.destination);const b=AC.createBuffer(1,AC.sampleRate*1,AC.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;NOISE=b}if(AC.state==='suspended')AC.resume();return AC}
function snare(t,vol){const a=AC,n=a.createBufferSource();n.buffer=NOISE;const hp=a.createBiquadFilter();hp.type='highpass';hp.frequency.value=1600;const g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+.09);n.connect(hp).connect(g).connect(MASTER);n.start(t,Math.random()*.5,.12);
  const o=a.createOscillator();o.type='triangle';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(140,t+.05);const g2=a.createGain();g2.gain.setValueAtTime(vol*.6,t);g2.gain.exponentialRampToValueAtTime(.001,t+.06);o.connect(g2).connect(MASTER);o.start(t);o.stop(t+.08)}
function boom(t,vol,f=70){const a=AC,o=a.createOscillator();o.type='sine';o.frequency.setValueAtTime(f*1.8,t);o.frequency.exponentialRampToValueAtTime(f,t+.12);const g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+.45);o.connect(g).connect(MASTER);o.start(t);o.stop(t+.5)}
function brass(t,f,dur,vol){const a=AC,lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.setValueAtTime(700,t);lp.frequency.linearRampToValueAtTime(2400,t+.06);lp.Q.value=2;const g=a.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.03);g.gain.setValueAtTime(vol*.85,t+dur-.04);g.gain.linearRampToValueAtTime(0,t+dur);
  [0,-6].forEach(det=>{const o=a.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=det;o.connect(lp);o.start(t);o.stop(t+dur+.02)});lp.connect(g).connect(MASTER)}

/* Írás: ha a szerver 4 mp-en belül (offline: azonnal) nem igazolja vissza, a készüléken sorba áll, és a háttérben szinkronizál. */
async function write(fn){

function readingsOf(vid){return arr('readings').filter(r=>r.vid===vid).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0))}
function valBefore(rs,end,f){let v=null;for(const r of rs)if(r.date<end&&r[f]!=null)v=r[f];return v}
function firstIn(rs,s,e,f){for(const r of rs)if(r.date>=s&&r.date<e&&r[f]!=null)return r[f];return null}
function delta(rs,s,e,f){const b=valBefore(rs,s,f)??firstIn(rs,s,e,f),a=valBefore(rs,e,f);return a==null||b==null?null:Math.max(0,a-b)}
function litersIn(vid,s,e){return arr('fuel').filter(f=>f.vid===vid&&f.date>=s&&f.date<e).reduce((t,f)=>t+(f.liters||0),0)}
function avgCons(v){const rs=readingsOf(v.id),fs=arr('fuel').filter(f=>f.vid===v.id);if(!fs.length||rs.length<2)return {};
  const first=rs[0].date,L=fs.filter(f=>f.date>=first).reduce((t,f)=>t+(f.liters||0),0),km=delta(rs,first,'9999','km'),h=delta(rs,first,'9999','h');
  return {l100:km>0&&L>0?L/km*100:null,lh:h>0&&L>0?L/h:null,L,km,h}}
/* Kiugró fogyasztás: az utolsó 30 nap átlaga vs. a gép korábbi saját átlaga (PzH: l/üó, többi: l/100 km). */

  const S0=addDays(today(),-30),first=rs[0].date;if(first>=S0)return null;const end=addDays(today(),1);
  const dB=delta(rs,first,S0,f),dR=delta(rs,S0,end,f);const LB=litersIn(v.id,first,S0),LR=litersIn(v.id,S0,end);
  const minB=f==='h'?10:200,minR=f==='h'?4:80;if(!(dB>=minB&&dR>=minR&&LB>0&&LR>0))return null;
  const k=f==='h'?1:100,base=LB/dB*k,rec=LR/dR*k,dev=rec/base-1;
  return {unit:f==='h'?'l/üó':'l/100 km',base,rec,dev,bad:Math.abs(dev)>0.3}}

  else if(MODE==='fb'){if(!AUTHSEEN){pct=18}else if(!UID){fin=true;txt='Belépés'}else if(USERDOC===undefined){pct=32;txt='Bejelentkezés…'}
    else if(!['member','commander','tech','admin'].includes(ROLE)){fin=true}
    else if(LOADED.size<COLS.length){pct=38+Math.round(58*LOADED.size/COLS.length);txt=`Adatok szinkronizálása… ${LOADED.size}/${COLS.length}`}else{fin=true;txt='Szinkronizálva'}}
  if(!navigator.onLine&&MODE==='fb')txt+=' · offline, a készüléken tárolt adatokból';
  const b=$('#spbar'),st=$('#spst');if(b)b.style.width=(fin?100:pct)+'%';if(st)st.textContent=txt;
  if(fin)splashHide()}
function splashHide(){if(SPLASH_DONE)return;SPLASH_DONE=true;const sp=$('#splash');if(!sp)return;setTimeout(()=>{sp.classList.add('out');setTimeout(()=>sp.remove(),500)},Math.max(250,1300-(Date.now()-T0)))}
setTimeout(()=>{if(!SPLASH_DONE){const st=$('#spst');if(st)st.textContent='Lassú kapcsolat – indítás a tárolt adatokkal';setTimeout(splashHide,900)}},9000);

/* ===== üzenőfal (Tagok) ===== */
const canChat=()=>MODE==='local'||['commander','tech','admin'].includes(ROLE);
let CHAT_SEEN=0;try{CHAT_SEEN=Number(localStorage.getItem('napra-chat-seen')||0)}catch(e){}
let CHAT_INIT=false,CHAT_KNOWN=new Set(),CHAT_DRAFT='';
const unreadMsgs=()=>arr('messages').filter(m=>m.ts>CHAT_SEEN&&m.by!==UID);
function markChatSeen(){const mx=Math.max(CHAT_SEEN,...arr('messages').map(m=>m.ts||0));if(mx>CHAT_SEEN){CHAT_SEEN=mx;try{localStorage.setItem('napra-chat-seen',String(mx))}catch(e){}}try{navigator.clearAppBadge&&navigator.clearAppBadge()}catch(e){}}
function onMessages(){const ms=arr('messages');
  if(!CHAT_INIT){CHAT_INIT=true;ms.forEach(m=>CHAT_KNOWN.add(m.id));return}
  const fresh=ms.filter(m=>!CHAT_KNOWN.has(m.id));fresh.forEach(m=>CHAT_KNOWN.add(m.id));
  const other=fresh.filter(m=>m.by!==UID).sort((a,b)=>a.ts-b.ts);if(!other.length)return;
  const visible=V.view==='tagok'&&!document.hidden;if(visible){markChatSeen();sndMsg();return}
  try{const n=unreadMsgs().length;navigator.setAppBadge&&navigator.setAppBadge(n)}catch(e){}
  if(!SET.notif)return;const m=other[other.length-1];
  sndMsg();toast(`Új üzenet – ${m.byName}: ${String(m.text).slice(0,60)}`);
  if(document.hidden&&'Notification' in window&&Notification.permission==='granted'){const body=String(m.text).slice(0,180),opt={body,icon:'icon-192.png',badge:'icon-192.png',tag:'napra-chat',renotify:true,silent:!SET.notifSnd,data:{view:'tagok'}};
    (navigator.serviceWorker?.ready||Promise.reject()).then(r=>r.showNotification('N(app)ra Gépek · '+m.byName,opt)).catch(()=>{try{new Notification('N(app)ra Gépek · '+m.byName,opt)}catch(e){}})}}
const fmtMsgT=ts=>{const d=new Date(ts),t=today(),k=iso(d);return (k===t?'':fmtS(k)+' ')+d.toTimeString().slice(0,5)};
function chatPanel(){const ms=arr('messages').sort((a,b)=>a.ts-b.ts).slice(-80);const can=canChat();
  const RC={admin:'adm',commander:'cmd',tech:'tech'};
  const log=ms.length?ms.map(m=>{const mine=m.by===UID;return `<div class="msg ${mine?'me':''}"><div class="mh"><b>${esc(m.byName||'?')}</b><span class="rchip ${RC[m.role]||''}">${roleName(m.role)}</span><span class="mt">${fmtMsgT(m.ts)}</span>${(mine||isAdmin())&&MODE==='fb'?`<button class="mx" data-act="delMsg" data-id="${m.id}" aria-label="Üzenet törlése">×</button>`:''}</div><div class="mb">${esc(m.text).replace(/\n/g,'<br>')}</div></div>`}).join(''):'<div class="hint" style="text-align:center;padding:18px 0">Még nincs üzenet. Az admin, a parancsnok és a technikus ír ide, mindenki más értesítést kap.</div>';
  return `<div class="panel chat"><h3>Üzenőfal <span class="hint" style="font-weight:600">${can?'mindenki látja':'csak olvasás'}</span></h3><div class="chatlog" id="chatlog">${log}</div>
   ${can?`<form class="chatin" id="chatForm"><textarea id="chatIn" rows="1" maxlength="1000" placeholder="Üzenet a csapatnak…" aria-label="Üzenet">${esc(CHAT_DRAFT)}</textarea><button class="btn pri" type="submit" aria-label="Küldés">${IC.send}</button></form>`:'<p class="hint" style="margin:8px 0 0">Ide az admin, a parancsnok és a technikus ír. Új üzenetnél értesítést kapsz — a Beállításokban (fogaskerék) kapcsolhatod.</p>'}</div>`}
document.addEventListener('submit',async e=>{if(e.target.id!=='chatForm')return;e.preventDefault();const ta=$('#chatIn');const txt=(ta.value||'').trim();if(!txt)return;if(!canChat()){toast('Ide csak admin, parancsnok és technikus írhat.');return}
  const data={text:txt.slice(0,1000),by:UID||'local',byName:myName(),role:ROLE||'admin',ts:Date.now()};const id=uid();CHAT_DRAFT='';ta.value='';CHAT_KNOWN.add(id);
  try{if(DB)await write(()=>DB.collection('messages').doc(id).set(data));else{S.messages[id]={...data,id};saveLocal();render()}markChatSeen()}catch(x){CHAT_DRAFT=txt;ta.value=txt;if(x&&x.code==='permission-denied')modal('Az üzenet nem ment el','<p>A szerver elutasította az üzenetet. Ennek oka szinte mindig az, hogy a <b>Firebase szabályok még nincsenek frissítve</b> az üzenőfalhoz.</p><p class="hint">Admin teendő: Firebase konzol → Firestore Database → <b>Rules</b> → a firestore.rules teljes tartalmát bemásolni → <b>Publish</b>. Utána az üzenet újraküldhető.</p>',null)}});
document.addEventListener('input',e=>{if(e.target.id==='chatIn'){CHAT_DRAFT=e.target.value;e.target.style.height='auto';e.target.style.height=Math.min(140,e.target.scrollHeight)+'px'}});
document.addEventListener('keydown',e=>{if(e.target.id==='chatIn'&&e.key==='Enter'&&!e.shiftKey&&matchMedia('(pointer:fine)').matches){e.preventDefault();$('#chatForm').requestSubmit()}});

/* ===== beállítások ===== */
function notifState(){if(!('Notification' in window))return 'Ez a böngésző nem támogat rendszerértesítést (iPhone-on csak a főképernyőre telepített app tudja).';return {granted:'Rendszerértesítés engedélyezve.',denied:'A rendszerértesítés le van tiltva – a telefon beállításaiban engedélyezheted.',default:'A rendszerértesítés még nincs engedélyezve.'}[Notification.permission]}
function settingsForm(){const sw=(k,l,on)=>`<label class="swr"><span>${l}</span><input type="checkbox" data-set="${k}" ${on?'checked':''}></label>`;
  modal('Beállítások',`<div class="setg"><div class="lbl">Hang</div>${sw('sound','Hangeffektek (fanfár, dobpergés)',SOUND)}<label class="slr"><span>Hangerő <b id="volv">${SET.vol}%</b></span><input type="range" min="0" max="100" step="5" value="${SET.vol}" data-set="vol"></label><button type="button" class="btn sm line" data-act="sndTest">Próbahang</button></div>
   <div class="setg"><div class="lbl">Értesítések</div>${sw('notif','Értesítés új üzenetről',SET.notif)}${sw('notifSnd','Értesítés hangja',SET.notifSnd)}<p class="hint" id="nst" style="margin:4px 0 6px">${notifState()}</p>${'Notification' in window&&Notification.permission==='default'?'<button type="button" class="btn sm pri" data-act="askNotif">Rendszerértesítés engedélyezése</button>':''}</div>
   <div class="setg"><div class="lbl">Megjelenés</div><span class="seg" style="margin-bottom:8px">${[['auto','Automatikus'],['light','Világos'],['dark','Sötét']].map(([k,l])=>`<button type="button" data-theme-set="${k}" aria-pressed="${SET.theme===k}">${l}</button>`).join('')}</span><label class="slr"><span>Fényerő <b id="brv">${SET.bright}%</b></span><input type="range" min="40" max="100" step="5" value="${SET.bright}" data-set="bright"></label><p class="hint" style="margin:2px 0 0">Éjszakai használathoz tompítja az app képét (a telefon saját fényerejét nem állítja).</p></div>
   <div class="setg"><div class="lbl">Az appról</div><p style="margin:0">N(app)ra Gépek <b>v${APP_VER}</b> · ${APP_DATE}</p><button type="button" class="btn sm line" data-act="reloadApp" style="margin-top:8px">Frissítés keresése / újratöltés</button></div>`,null);
  const f=$('#mform');
  f.addEventListener('input',e=>{const k=e.target.dataset.set;if(!k)return;
    if(k==='sound'){SOUND=e.target.checked;if(SOUND)sndDrum()}else if(k==='vol'){SET.vol=Number(e.target.value);$('#volv').textContent=SET.vol+'%'}else if(k==='bright'){SET.bright=Number(e.target.value);$('#brv').textContent=SET.bright+'%'}else SET[k]=e.target.checked;
    saveSet();applySet()});
  f.addEventListener('change',e=>{if(e.target.dataset.set==='vol'&&SOUND)sndAdd()});
  f.addEventListener('click',async e=>{const t=e.target.closest('[data-theme-set],[data-act]');if(!t)return;
    if(t.dataset.themeSet){SET.theme=t.dataset.themeSet;saveSet();applySet();f.querySelectorAll('[data-theme-set]').forEach(b=>b.setAttribute('aria-pressed',b===t))}
    else if(t.dataset.act==='sndTest'){e.stopPropagation();const o=SOUND;SOUND=true;sndAdd();SOUND=o}
    else if(t.dataset.act==='askNotif'){e.stopPropagation();try{await Notification.requestPermission()}catch(x){}$('#nst').textContent=notifState();if(Notification.permission!=='default')t.remove()}
    else if(t.dataset.act==='reloadApp'){e.stopPropagation();try{const r=await navigator.serviceWorker?.getRegistration();await r?.update()}catch(x){}location.reload()}})}
function render(){
  const cmd=ROLE==='commander',adm=MODE==='fb'&&ROLE==='admin';document.body.classList.toggle('role-cmd',cmd);document.body.classList.toggle('role-adm',adm);const tc=document.querySelector('meta[name=theme-color]');if(tc)tc.content=cmd?'#0F2D66':adm?'#06524E':'#6E0B13';
  if(MODE==='fb'&&(!UID||USERDOC===undefined||!USERDOC||!['member','commander','tech','admin'].includes(ROLE))){$('#mode').innerHTML='';$('#nav').innerHTML='';$('#main').innerHTML=renderGate();splashTick();return}
  syncUI();$('#mode').innerHTML=MODE==='fb'?`<button class="who" data-act="profile">${esc(myName())}<span>${roleName(ROLE)}</span></button>`:MODE==='local'?'demó mód':'betöltés…';
  const nf=arr('faults').filter(f=>f.status!=='lezárva').length,nt=arr('trips').filter(tripLive).length;
  const np=arr('requests').filter(r=>r.status==='pending'&&(seesAll()||r.by===UID)).length+(isTech()?0:myDecidedUnseen())
  const nu=isAdmin()&&MODE==='fb'?arr('users').filter(u=>u.role==='pending').length:0;
  const items=[['flotta','Gépek',0],['naptar','Naptár',0],['menet','Menetlevél',nt],['sofor','Sofőrök',0],['hibak','Hibák',nf],['kerelmek','Kérelmek',np]];{const un=unreadMsgs().length;items.push(['tagok','Tagok',nu+un])}document.body.classList.toggle('nav7',items.length>6);
  $('#nav').innerHTML=items.map(([k,l,c])=>`<button data-view="${k}" ${k==='menet'&&nt?'class="mlon" ':''}${(V.view===k||(k==='flotta'&&V.view==='gep'))?'aria-current="page"':''}>${k==='menet'?IC.mlnav:IC[k]}<span>${l}</span>${c?`<span class="cnt">${c}</span>`:''}</button>`).join('');
  if(LOADED.size<COLS.length){$('#main').innerHTML='<div class="empty">Adatok betöltése…</div>';splashTick();return}
  const banner=MODE==='local'?'<div class="banner">Demó mód: a firebase-config.js még nincs kitöltve, az adatok csak ezen az eszközön maradnak meg.</div>':'';
  if(V.view==='gep'&&!S.vehicles[V.vid])V.view='flotta';
  const html=V.view==='gep'?renderVehicle(S.vehicles[V.vid]):V.view==='naptar'?renderCalendar():V.view==='menet'?renderMoves():V.view==='sofor'?renderDrivers():V.view==='hibak'?renderFaults():V.view==='tagok'?renderMembers():V.view==='kerelmek'?renderRequests():renderFleet();
  const hadFocus=document.activeElement?.id==='chatIn';
  $('#main').innerHTML=banner+html;
  if(V.view==='kerelmek')markRqSeen();
  if(V.view==='tagok'){markChatSeen();const cl=$('#chatlog');if(cl)cl.scrollTop=cl.scrollHeight;if(hadFocus){const ta=$('#chatIn');if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length)}}}
  splashTick();
  hydratePhotos();
  if(V.view==='flotta')bindTrack();
}

const PAGES=['all',...TORDER];
function renderFleet(){
  const tabs=`<div class="tabs" id="ptabs">${PAGES.map((p,i)=>`<button data-page="${i}" aria-pressed="${V.page===i}">${p==='all'?'Összesítő':TYPES[p].name}<span class="n">${p==='all'?arr('vehicles').length:byType(p).length}</span></button>`).join('')}</div>`;
  const pages=PAGES.map(p=>`<section class="pg" aria-label="${p==='all'?'Összesítő':TYPES[p].name}">${p==='all'?renderParade():renderTypePage(p)}</section>`).join('');
  return tabs+`<div class="track" id="track">${pages}</div><div class="dots" id="pdots">${PAGES.map((_,i)=>`<i class="${i===V.page?'on':''}"></i>`).join('')}</div>`;
}
const stockDoc=()=>S.stock.pads||{count:0,linksPerSide:94};
function palletSVG(count){const per=10,n=Math.min(Math.ceil(count/per),48),cols=8,W=260,H=170,bw=26,bh=17,x0=(W-cols*(bw+3))/2,yBase=H-34;let cubes='';
  for(let i=0;i<n;i++){const r=Math.floor(i/cols),c=i%cols;const x=x0+c*(bw+3)+(r%2?6:0),y=yBase-(r+1)*(bh+2);if(x+bw>W-4)continue;
    cubes+=`<g class="cube" style="--i:${i}"><rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="3" style="fill:var(--rubber);stroke:var(--rubber-edge)"/><rect x="${x+3}" y="${y+3}" width="${bw-6}" height="3" rx="1.5" style="fill:var(--rubber-edge)"/></g>`}
  const slat=y=>`<rect x="14" y="${y}" width="${W-28}" height="7" rx="2" style="fill:var(--wood)"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Raklap ${count} darab gumipogácsával">${cubes}${slat(yBase)}${[24,W/2-12,W-48].map(x=>`<rect x="${x}" y="${yBase+7}" width="24" height="12" rx="2" style="fill:var(--wood-dark)"/>`).join('')}${slat(yBase+19)}</svg>`}
function stockPanel(){const s=stockDoc(),L=s.linksPerSide||94,per=L*4,pzhs=byType('pzh').filter(v=>v.reg),need=pzhs.reduce((t,v)=>t+(v.trackLinks??L)*4,0);
  const full=per?Math.floor((s.count||0)/per):0;
  return `<div class="panel stock" style="margin-top:14px"><h3>Technikai állomány · tartalék gumipogácsa <span class="row"><button class="btn sm line" data-act="stockEdit">Szerkesztés</button></span></h3>
   <div class="stockrow"><div class="pallet">${palletSVG(s.count||0)}<div class="hint" style="text-align:center">1 kocka = 10 db</div></div>
    <div class="stockinfo"><div class="lbl">Raktáron</div><div class="bigc">${n0(s.count||0)}<small> db</small></div>
     <div class="row stepper"><button class="btn sm" data-act="stockStep" data-n="-10">−10</button><button class="btn sm" data-act="stockStep" data-n="-1">−1</button><button class="btn sm" data-act="stockStep" data-n="1">+1</button><button class="btn sm pri" data-act="stockStep" data-n="10">+10</button></div>
     <dl class="kv" style="margin-top:10px"><dt>Egy PzH teljes cseréje</dt><dd>${per} db (${L} lánctag × 2 oldal × 2 pogácsa)</dd><dt>Készletből</dt><dd>${full} gép teljes cseréjére elég</dd>${pzhs.length?`<dt>Összes PzH (${pzhs.length} db) igénye</dt><dd>${n0(need)} db</dd>`:''}</dl>
     <p class="hint" style="margin:8px 0 0">Gyári: 95 lánctag/oldal, lánctagonként 2 gumipogácsa → 190 + 190 = <b>380 db</b>. A mostani gépeken jellemzően 94 lánctag van → <b>376 db</b>. A lánctag-szám gépenként is állítható (gép → Adatok → Szerkesztés).</p></div></div></div>`}
function renderParade(){
  const vs=arr('vehicles');const c={ok:0,limited:0,service:0};vs.forEach(v=>c[st(v)]++);const N=vs.length;
  const pct=N?Math.round(c.ok/N*100):0;let k=0;
  const ranks=TORDER.map((t,i)=>{const list=byType(t);
    const units=list.length?list.map(v=>{const s=st(v);return `<div class="unit ${s} u-${t}" style="--i:${k++}" title="${esc(vLabel(v))} — ${STATUS[s][0]}">${SIL[t]}${s==='service'?`<span class="wr">${IC.service}</span>`:''}</div>`}).join(''):`<div class="unit empty u-${t}" style="--i:${k++}">${SIL[t]}</div>`;
    return `<button class="rank" data-page="${i+1}" aria-label="${TYPES[t].name}: ${list.length} db"><div class="nm"><b>${list.length}</b>${TYPES[t].name}</div><div class="units">${units}</div></button>`}).join('');
  const trips=arr('trips').filter(tripLive),nf=arr('faults').filter(f=>f.status!=='lezárva');
  const ws=weekStart(today()),wl=arr('fuel').filter(f=>f.date>=ws&&f.date<addDays(ws,7)).reduce((t,f)=>t+(f.liters||0),0);
  let due=0;vs.forEach(v=>{const ms=maintSummary(v);if(ms&&ms.s.worst!=='ok')due++;const mu=TYPES[v.type]?.musz&&muszState(v);if(mu&&mu.cls!=='ok')due++});
  return `<div class="parade"><svg class="bearbig" viewBox="0 0 100 100" aria-hidden="true">${BEAR}</svg>
    <div class="lbl" style="color:var(--hero-fg);opacity:.8">Díszszemle · ${fmtD(today())}<span class="pver">v${APP_VER}</span></div><h2>Technikai állomány</h2>
    <div class="kpis"><div class="kpi"><b>${N}</b><span>Összes gép</span></div><div class="kpi"><b>${N?pct+'%':'–'}</b><span>Hadra fogható</span></div><div class="kpi"><b>${c.service}</b><span>Szervizben</span></div></div>
    <div class="ready" role="img" aria-label="${c.ok} hadra fogható, ${c.limited} korlátozott, ${c.service} szervizben">${N?`<i style="width:${c.ok/N*100}%;background:var(--hero-fg)"></i><i style="width:${c.limited/N*100}%;background:var(--brass)"></i><i style="width:${c.service/N*100}%;background:rgba(255,243,241,.3)"></i>`:''}</div>
    <div class="ranks">${ranks}</div>
    <div class="legend"><span><span class="dot" style="background:var(--hero-fg)"></span>Hadra fogható ${c.ok}</span><span><span class="dot" style="background:var(--brass)"></span>Korlátozottan ${c.limited}</span><span><span class="dot" style="background:rgba(255,243,241,.32)"></span>Szervizben ${c.service}</span></div></div>
   ${todayPanel(trips,nf,wl)}
   ${fuelPanel()}
   ${stockPanel()}
   <div class="cols" style="margin-top:14px">
   <div class="panel"><h3>Kezelés <span class="pill">v${APP_VER}</span></h3><p class="hint" style="margin:0">Lapozz oldalra a típusokhoz. A <b>+</b> és <b>−</b> gombbal adsz hozzá vagy veszel el gépet, a pajzs / háromszög / villáskulcs gombbal állítod a hadrafoghatóságot.</p></div></div>`;
}
function todayPanel(trips,nf,wl){const vs=orderedVehicles().filter(v=>v.reg);
  const chip=(v,txt,cls='')=>`<button class="tchip ${cls}" data-open="${v.id}"><b>${esc(vLabel(v))}</b><span>${txt}</span></button>`;
  const ml=trips.slice().sort((a,b)=>(a.to||'9')<(b.to||'9')?-1:1).map(t=>{const v=S.vehicles[t.vid];if(!v)return '';const d=t.to?diffDays(today(),t.to):null;return chip(v,t.to?(d===0?'ma lejár':fmtS(t.to)+'-ig'):'érvényes',d!=null&&d<=1?'warn':'')}).join('');
  const sv=vs.filter(v=>st(v)==='service').map(v=>chip(v,v.serviceUntil?fmtS(v.serviceUntil)+'-ig':'határidő nélkül','svc')).join('');
  const dl=[];const R={bad:0,warn:1};
  vs.forEach(v=>{const mu=TYPES[v.type]?.musz&&muszState(v);if(mu&&mu.cls!=='ok')dl.push({v,cls:mu.cls,txt:mu.txt});
    if(v.type==='pzh')tkItems(v).filter(i=>i.st!=='ok').forEach(i=>dl.push({v,cls:i.st,txt:`${i.code==='E'?'Bejáratás E1–E4':i.code}: ${tkLeftTxt(i)}`}));
    (v.maint||[]).forEach(m=>{const s=maintStatus(v,m);if(s.worst==='bad'||s.worst==='warn')dl.push({v,cls:s.worst,txt:`${m.name}: ${s.out.map(leftTxt).join(' / ')}`})});
    const cw=consWarn(v);if(cw)dl.push({v,cls:'warn',txt:`Kiugró fogyasztás ${cw.dev>0?'+':''}${Math.round(cw.dev*100)}%`})});
  dl.sort((a,b)=>R[a.cls]-R[b.cls]);
  return `<div class="panel today" style="margin-top:14px"><h3>Mai helyzet · ${fmtD(today())}</h3>
   <div class="tgrid"><div class="tk"><b>${trips.length}</b><span>kint lévő ML</span></div><div class="tk"><b>${vs.filter(v=>st(v)==='service').length}</b><span>szervizben</span></div><div class="tk ${dl.some(x=>x.cls==='bad')?'bad':dl.length?'warn':''}"><b>${dl.length}</b><span>határidő / jelzés</span></div><div class="tk"><b>${n0(wl)}</b><span>l tankolva (${isoWeek(today())}. hét)</span></div></div>

function buckets(p){const t=today(),out=[];

  if(p==='honap'){const d=pd(t);for(let i=11;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1),y=new Date(x.getFullYear(),x.getMonth()+1,1);out.push({s:iso(x),e:iso(y),l:x.getFullYear()+' '+HU_MS[x.getMonth()]})}}
  if(p==='ev'){const y=pd(t).getFullYear();for(let i=4;i>=0;i--)out.push({s:(y-i)+'-01-01',e:(y-i+1)+'-01-01',l:String(y-i)})}
  return out}

   ${rows.slice().reverse().map(r=>`<tr><td>${esc(r.l)}</td><td class="r mono">${n0(r.km)}</td>${t.hours?`<td class="r mono">${n1(r.h)}</td>`:''}<td class="r mono">${n0(r.L)}</td><td class="r mono">${n1(r.l100)}</td>${t.hours?`<td class="r mono">${n1(r.lh)}</td>`:''}</tr>`).join('')}
   <tr class="hl"><td>Összesen</td><td class="r mono">${n0(tot.km)}</td>${t.hours?`<td class="r mono">${n1(tot.h)}</td>`:''}<td class="r mono">${n0(tot.L)}</td><td class="r mono">${n1(tot.km&&tot.L?tot.L/tot.km*100:null)}</td>${t.hours?`<td class="r mono">${n1(tot.h&&tot.L?tot.L/tot.h:null)}</td>`:''}</tr></tbody></table></div></div>`;

const RQF={ghbH:'GHB üó',resolution:'Lezárás módja',closedDate:'Lezárás dátuma',part:'Cserélt alkatrész',log:'Hibanapló',vid:'Gép',date:'Dátum',liters:'Mennyiség (l)',reason:'Ok',kind:'Fajta',km:'km-óra',h:'Össz. üzemóra',motorH:'Motor üó',valtoH:'Váltó üó',apuH:'APU üó',gkaH:'GKA üó',apu:'APU üó',note:'Megjegyzés',num:'ML szám',driver:'Név',from:'Ettől',to:'Eddig',startKm:'Induló km',startH:'Induló üó',endKm:'Záró km',endH:'Záró üó',returned:'VisszaMEA dátum',returnLiters:'Visszatankolva (l)',closed:'Lezárva',title:'Hiba',sev:'Súlyosság',desc:'Leírás',status:'Állapot',place:'Helyszín',task:'Feladat',color:'Szín',reg:'Rendszám',variant:'Változat',musz:'Műszaki lejárat',serviceFrom:'Szerviz ettől',serviceUntil:'Szerviz eddig',driverId:'Sofőr',fuel:'Üzemanyagszint',tankCap:'Tartály (l)',photos:'Fotók',tripId:'Menetlevél',mgSn:'FN MAG sorozatszám',mainWeapon:'Fő fegyverzet',mainWeaponSn:'Fő fegyverzet sorozatszám',trackLinks:'Lánctag / oldal',start:'Indulás',end:'Érkezés',kmStart:'Induló km',kmEnd:'Érkező km',purpose:'Cél',maint:'Karbantartási ciklusok',tk:'KNDS kiszolgálás',lic:'Jogosítványok',rank:'Rendfokozat',name:'Név',count:'Darab',linksPerSide:'Lánctag / oldal',type:'Típus',measured:'VisszaMEA-zva',refueled:'Visszatankolva',group:'Csoportos kiadás'};
const RQSKIP=new Set(['ts','approvedBy','approvedAt','submittedBy','closedAt','id','by']);
const OPNAME={add:'Új',upd:'Módosítás',del:'Törlés'};
function rqVal(k,x){if(x==null||x==='')return '–';
  if(k==='vid'){const v=S.vehicles[x];return v?esc(vLabel(v)):'?'}
  if(k==='driverId'){return x?esc(dName(S.drivers[x])||'?'):'nincs'}
  if(k==='tripId'){const t=S.trips[x];return t?'ML '+esc(t.num):'?'}
  if(k==='status')return esc((STATUS[x]||FST[x]||[x])[0]);
  if(k==='color')return `<span class="sw" style="background:${esc(x)}"></span>`;
  if(k==='fuel')return `${n0(x.l)} l`;
  if(k==='photos')return Array.isArray(x)?x.length+' db':'–';
  if(k==='log')return Array.isArray(x)&&x.length?`${x.length} bejegyzés · utolsó: ${esc((x[x.length-1].note)||'')}`:'–';
  if(k==='resolution')return esc(FRES[x]||x);
  if(k==='maint')return Array.isArray(x)?x.length+' ciklus':'–';
  if(k==='tk'){const l=(x.log||[]);return l.length?`${esc(l[l.length-1].code)} elvégezve (${fmtD(l[l.length-1].date)})`:'alapadatok'}
  if(k==='type')return esc(TYPES[x]?.name||x);
  if(k==='kind')return ({tank:'tankolás',visszavetel:'visszatankolás (VisszaMEA)'})[x]||esc(x);
  if(typeof x==='boolean')return x?'igen':'nem';
  if(typeof x==='number')return n1(x);
  if(typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x))return fmtD(x);
  if(Array.isArray(x))return esc(x.join(', '));
  if(typeof x==='object')return esc(JSON.stringify(x).slice(0,80));
  return esc(String(x))}
function rqDetails(r){const ops=r.ops||[];
  return ops.map(o=>{const cur=S[o.c]?.[o.id]||{};const d=o.data||{};
    const head=`${OPNAME[o.op]||o.op}: ${esc(COLNAME[o.c]||o.c)}${o.op!=='add'&&o.c==='vehicles'&&cur.reg?' · '+esc(cur.reg):''}${o.op==='del'&&cur.num?' · ML '+esc(cur.num):''}`;
    if(o.op==='del')return `<div class="rqop"><div class="rqoh del">${head}</div>${Object.keys(cur).length?`<div class="hint">${Object.entries(cur).filter(([k])=>RQF[k]&&!RQSKIP.has(k)).slice(0,6).map(([k,x])=>`${RQF[k]}: ${rqVal(k,x)}`).join(' · ')}</div>`:''}</div>`;
    const rows=Object.entries(d).filter(([k])=>!RQSKIP.has(k)).map(([k,x])=>{const old=o.op==='upd'?cur[k]:undefined;const ch=o.op==='upd'&&JSON.stringify(old??null)!==JSON.stringify(x??null);
      return `<tr class="${ch?'ch':''}"><th>${esc(RQF[k]||k)}</th><td>${o.op==='upd'&&ch?`<s>${rqVal(k,old)}</s> → `:''}<b>${rqVal(k,x)}</b></td></tr>`}).join('');
    return `<div class="rqop"><div class="rqoh ${o.op}">${head}</div><table class="rqt">${rows}</table></div>`}).join('')}
function rqTimeline(r){const step=(on,cls,txt)=>`<li class="${on?'on '+cls:''}">${txt}</li>`;
  return `<ol class="rqtl">${step(true,'',`Beküldve · <b>${esc(r.byName)}</b> · ${fmtTs(r.ts)}`)}
   ${step(!!(r.seenAt||r.reviewedAt),'',r.seenAt||r.reviewedAt?`Technikus olvasta · <b>${esc(r.seenBy||r.reviewer||'')}</b> · ${fmtTs(r.seenAt||r.reviewedAt)}`:'Technikus még nem olvasta')}
   ${r.status==='pending'?step(false,'','Döntésre vár'):r.status==='approved'?step(true,'ok',`Jóváhagyva · <b>${esc(r.reviewer||'')}</b> · ${fmtTs(r.reviewedAt)}${r.note?` · „${esc(r.note)}”`:''}`):step(true,'bad',`Elutasítva · <b>${esc(r.reviewer||'')}</b> · ${fmtTs(r.reviewedAt)}${r.reason?` · indok: „${esc(r.reason)}”`:''}`)}</ol>`}
const RQ_OPEN=new Set(),RQ_NOTE={};document.addEventListener('input',e=>{if(e.target.id&&e.target.id.startsWith('rqn_'))RQ_NOTE[e.target.id.slice(4)]=e.target.value});
document.addEventListener('toggle',async e=>{const dt=e.target;if(!dt.matches||!dt.matches('details[data-rqd]'))return;const id=dt.dataset.rqd;if(dt.open)RQ_OPEN.add(id);else RQ_OPEN.delete(id);
  const r=S.requests[id];if(dt.open&&r&&r.status==='pending'&&!r.seenAt&&isTech()&&DB&&r.by!==UID){try{await write(()=>DB.doc('requests/'+id).update({seenBy:myName(),seenAt:Date.now()}))}catch(x){}}},true);

const myDecidedUnseen=()=>arr('requests').filter(r=>r.by===UID&&r.status!=='pending'&&(r.reviewedAt||0)>RQ_SEEN).length;
function markRqSeen(){const mx=Math.max(RQ_SEEN,...arr('requests').filter(r=>r.by===UID).map(r=>r.reviewedAt||0));if(mx>RQ_SEEN){RQ_SEEN=mx;try{localStorage.setItem('napra-rq-seen',String(mx))}catch(e){}}}
function onRequests(){const rs=arr('requests');
  if(!RQ_INIT){if(!LOADED.has('requests'))return;RQ_INIT=true;rs.forEach(r=>RQ_KNOWN.set(r.id,r.status+'|'+(r.seenAt||0)));return}
  const notes=[];rs.forEach(r=>{const k=r.status+'|'+(r.seenAt||0),prev=RQ_KNOWN.get(r.id);RQ_KNOWN.set(r.id,k);if(prev==null||prev===k||r.by!==UID)return;
    const [ps]=prev.split('|');const what=(r.lines||[])[0]||r.cat;
    if(ps==='pending'&&r.status==='approved')notes.push({t:'Jóváhagyva ✔',b:`${r.reviewer||'Technikus'} jóváhagyta: ${what}${r.note?' – „'+r.note+'”':''}`,ok:true});
    else if(ps==='pending'&&r.status==='rejected')notes.push({t:'Elutasítva ✖',b:`${r.reviewer||'Technikus'} elutasította: ${what}${r.reason?' – indok: „'+r.reason+'”':''}`});
    else if(r.status==='pending'&&r.seenAt)notes.push({t:'Olvasva',b:`${r.seenBy||'A technikus'} megnyitotta a kérelmed: ${what}`,seen:true})});
  if(!notes.length)return;const n=notes[notes.length-1];
  if(V.view==='kerelmek'&&!document.hidden)markRqSeen();
  if(n.ok)sndAdd();else if(!n.seen)sndRemove();else sndMsg();toast(n.t+' – '+n.b);
  if(SET.notif&&document.hidden&&'Notification' in window&&Notification.permission==='granted'){const opt={body:n.b,icon:'icon-192.png',tag:'napra-rq',renotify:true,silent:!SET.notifSnd};
    (navigator.serviceWorker?.ready||Promise.reject()).then(r=>r.showNotification('Kérelem: '+n.t,opt)).catch(()=>{try{new Notification('Kérelem: '+n.t,opt)}catch(e){}})}}

function autoScroll(){if(!DRAG||!DRAG.moved)return;const edge=110,y=DRAG.cy,h=innerHeight;let dy=0;
  if(y<edge+40)dy=-Math.ceil((edge+40-y)/6);else if(y>h-edge-60)dy=Math.ceil((y-(h-edge-60))/6);
  if(dy){scrollBy(0,dy);const t=document.elementFromPoint(DRAG.cx,DRAG.cy)?.closest('[data-drop]')||null;if(DRAG.over!==t){DRAG.over?.classList.remove('over');t?.classList.add('over');DRAG.over=t}}
  DRAG.raf=requestAnimationFrame(autoScroll)}
document.addEventListener('pointerdown',e=>{
  if($('#scrim'))return;
  const c=e.target.closest('[data-drag]');
  if(c&&!e.target.closest('.x')&&!READONLY){DRAG={id:c.dataset.drag,x:e.clientX,y:e.clientY,src:c,moved:false,ghost:null,over:null};return}
  const h=e.target.closest('#hero');if(h&&!e.target.closest('button'))SW={x:e.clientX,y:e.clientY,h};
});
document.addEventListener('pointermove',e=>{
  if(DRAG){if(!DRAG.moved&&Math.hypot(e.clientX-DRAG.x,e.clientY-DRAG.y)>6){DRAG.moved=true;const g=DRAG.src.cloneNode(true);g.classList.add('ghost');g.removeAttribute('data-drag');document.body.appendChild(g);DRAG.ghost=g}
    if(DRAG.moved){e.preventDefault();DRAG.cy=e.clientY;DRAG.cx=e.clientX;if(!DRAG.raf)DRAG.raf=requestAnimationFrame(autoScroll);DRAG.ghost.style.left=e.clientX+'px';DRAG.ghost.style.top=e.clientY+'px';const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-drop]')||null;if(DRAG.over!==t){DRAG.over?.classList.remove('over');t?.classList.add('over');DRAG.over=t}}}
  else if(SW){const dx=e.clientX-SW.x;if(Math.abs(dx)>10&&Math.abs(e.clientY-SW.y)<40)SW.h.style.transform=`translateX(${dx*.35}px)`}
},{passive:false});
document.addEventListener('pointerup',async e=>{
  if(DRAG){const dr=DRAG;DRAG=null;if(dr.moved){justDragged=Date.now();dr.ghost?.remove();dr.over?.classList.remove('over');if(dr.over){try{await act(()=>assign(dr.id,dr.over.dataset.drop))}catch(x){if(typeof x==='string')toast(x)}}else render()}return}
  if(SW){const dx=e.clientX-SW.x,dy=e.clientY-SW.y;SW.h.style.transform='';SW=null;if(Math.abs(dx)>70&&Math.abs(dy)<50){justDragged=Date.now();const v=S.vehicles[V.vid];const l=byType(v.type),i=l.findIndex(x=>x.id===V.vid);const n=dx<0?l[i+1]:l[i-1];if(n)openVehicle(n.id,true)}}
});
document.addEventListener('pointercancel',()=>{if(DRAG){DRAG.ghost?.remove();DRAG.over?.classList.remove('over');DRAG=null}if(SW){SW.h.style.transform='';SW=null}});

render();
boot();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
