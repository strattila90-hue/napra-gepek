<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6E0B13">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Napra Gépek">
<title>N(app)ra Gépek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap&subset=latin-ext">
<style>
/* Layout: tüzér-vörös, lekerekített app. Felül sáv (medve-jelvény), középen oldalra lapozható típus-oldalak (Összesítő díszszemle + 6 típus), alul fix menü. Háttérben halvány Szent Borbála. */
:root{
  --bg:#F3EFEF; --surface:#FFFFFF; --surface2:#F7EDEE; --fg:#1E1416; --muted:#6F5E61; --line:#E6D7D9;
  --accent:#B0121E; --accent-deep:#6E0B13; --accent-fg:#FFFFFF; --brass:#A87A22;
  --hero1:#6E0B13; --hero2:#B0121E; --hero-fg:#FFF3F1;
  --ok:#23773A; --ok-bg:#DDF0E1; --warn:#9A6206; --warn-bg:#FBEBC9; --bad:#B0121E; --bad-bg:#FADADC; --svc:#4F5E70; --svc-bg:#E1E7EE;
  --c1:#2F6E9A; --c2:#B0121E; --c3:#6A4FA8; --c4:#23773A; --c5:#9A6206; --c6:#3F7A70; --c7:#6F6667;
  --saint:#B0121E; --rubber:#2B2627; --rubber-edge:#4A4244; --wood:#C79A5B; --wood-dark:#9C7440;
  --f-display:"Anton","Impact","Arial Narrow",sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:20px; --navh:66px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#150C0E; --surface:#201517; --surface2:#2A1A1D; --fg:#F5EAEB; --muted:#B9A2A6; --line:#3B262A;
  --accent:#E8424E; --accent-deep:#8F1520; --accent-fg:#FFFFFF; --brass:#E2B45C;
  --hero1:#4E0810; --hero2:#951420; --hero-fg:#FFF3F1;
  --ok:#7BD08E; --ok-bg:#1C3424; --warn:#F2C062; --warn-bg:#3B2C12; --bad:#FF7B84; --bad-bg:#47191D; --svc:#A9BACD; --svc-bg:#25303C;
  --c1:#7FB7DE; --c2:#FF7B84; --c3:#B7A3EE; --c4:#7BD08E; --c5:#F2C062; --c6:#8FC6BB; --c7:#B9B0B1; --saint:#E8424E; --rubber:#0E0B0C; --rubber-edge:#5A5052; --wood:#B98C52; --wood-dark:#8A6638; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#150C0E; --surface:#201517; --surface2:#2A1A1D; --fg:#F5EAEB; --muted:#B9A2A6; --line:#3B262A;
  --accent:#E8424E; --accent-deep:#8F1520; --accent-fg:#FFFFFF; --brass:#E2B45C;
  --hero1:#4E0810; --hero2:#951420; --hero-fg:#FFF3F1;
  --ok:#7BD08E; --ok-bg:#1C3424; --warn:#F2C062; --warn-bg:#3B2C12; --bad:#FF7B84; --bad-bg:#47191D; --svc:#A9BACD; --svc-bg:#25303C;
  --c1:#7FB7DE; --c2:#FF7B84; --c3:#B7A3EE; --c4:#7BD08E; --c5:#F2C062; --c6:#8FC6BB; --c7:#B9B0B1; --saint:#E8424E; --rubber:#0E0B0C; --rubber-edge:#5A5052; --wood:#B98C52; --wood-dark:#8A6638; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.muted{color:var(--muted)} .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lbl{font-weight:700;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.saint{position:fixed;right:-4vw;bottom:calc(var(--navh) - 10px);height:78vh;width:auto;max-width:70vw;color:var(--saint);opacity:.055;pointer-events:none;z-index:0}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(100deg,var(--hero1),var(--hero2));color:var(--hero-fg);padding:10px 16px;display:flex;align-items:center;gap:12px;border-radius:0 0 22px 22px;box-shadow:0 6px 18px rgba(80,0,10,.18)}
.topbar .badge-bear{width:42px;height:42px;flex:none}
.topbar .brand{font-family:var(--f-display);font-size:24px;letter-spacing:.03em;line-height:1}
.topbar .sub{font-size:12px;opacity:.8;font-weight:600;letter-spacing:.04em}
.topbar .tools{margin-left:auto;display:flex;gap:6px;align-items:center}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1.5px solid rgba(255,243,241,.45);background:transparent;color:inherit;cursor:pointer;display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
#snd{width:46px;height:46px;background:rgba(255,255,255,.16);border:2px solid rgba(255,243,241,.7);box-shadow:0 2px 10px rgba(0,0,0,.18)}
#snd svg.gearic{width:30px;height:30px;stroke:none}
@media (prefers-reduced-motion:no-preference){#snd:active svg{transform:rotate(60deg);transition:transform .25s}}
.mode{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.8;white-space:nowrap}
.page{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:14px calc(var(--navh) + 34px)}
.banner{margin-bottom:12px;padding:9px 14px;background:var(--warn-bg);color:var(--warn);font-size:14px;border-radius:14px;font-weight:600}
nav.bottom{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;justify-content:center}
nav.bottom .in{display:flex;width:100%;max-width:560px;background:var(--surface);border-radius:24px;box-shadow:0 8px 28px rgba(60,0,8,.22);border:1px solid var(--line);padding:4px}
nav.bottom button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 2px;cursor:pointer;color:var(--muted);font-weight:700;font-size:11px;letter-spacing:.03em;position:relative;min-width:0;border-radius:20px}
nav.bottom svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9}
nav.bottom button[aria-current="page"]{color:var(--accent-fg);background:var(--accent)}
nav.bottom .cnt{position:absolute;top:2px;left:calc(50% + 8px);background:var(--brass);color:var(--surface);font-family:var(--f-mono);font-size:10px;border-radius:8px;padding:0 5px;line-height:16px}
.btn{border:0;background:var(--surface2);color:var(--fg);padding:10px 18px;border-radius:999px;cursor:pointer;font-weight:700;font-size:14.5px;white-space:nowrap}
.btn.pri{background:var(--accent);color:var(--accent-fg)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.line{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{min-height:70px;resize:vertical}
.pill{font-size:12.5px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap;line-height:1.6}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.svc{background:var(--svc-bg);color:var(--svc)}
.pills{display:flex;gap:5px;flex-wrap:wrap}
.panel{background:var(--surface);border-radius:var(--r);padding:16px 18px;min-width:0;box-shadow:0 1px 0 var(--line),0 4px 16px rgba(60,0,8,.05)}
.panel>h3{font-weight:800;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
@media (max-width:420px){.cols{grid-template-columns:1fr}}
.empty{padding:18px;border:2px dashed var(--line);border-radius:16px;color:var(--muted);text-align:center;font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--f-mono);overflow-wrap:anywhere}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.r{text-align:right} td.mono{white-space:nowrap}
tr.hl td{background:var(--surface2);font-weight:700}
.list{display:flex;flex-direction:column;gap:8px}
.item{border-radius:14px;padding:11px 13px;display:flex;gap:10px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;background:var(--surface2)}
.item .main{min-width:0;flex:1 1 200px} .item .t{font-weight:700}
.hint{font-size:13px;color:var(--muted)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.thumbs button{border:0;padding:0;background:var(--line);border-radius:10px;cursor:pointer;width:60px;height:60px;overflow:hidden}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 13px;font-weight:700;cursor:pointer;font-size:13px;border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;margin-right:5px}

/* ===== lapozó fülsor + sín ===== */
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 10px}
.tabs button{border:0;background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:800;font-size:13.5px;cursor:pointer;white-space:nowrap;box-shadow:inset 0 0 0 1.5px var(--line);display:flex;align-items:center;gap:6px}
.tabs button .n{font-family:var(--f-mono);font-size:12px;opacity:.75}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);box-shadow:none}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;gap:0;overscroll-behavior-x:contain;align-items:flex-start}
.track::-webkit-scrollbar{display:none}
.pg{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;min-width:0;padding:0 2px}
.dots{display:flex;justify-content:center;gap:6px;margin:12px 0 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent);width:20px;border-radius:4px}

/* ===== díszszemle (összesítő) ===== */
.parade{position:relative;border-radius:26px;overflow:hidden;background:linear-gradient(160deg,var(--hero1),var(--hero2));color:var(--hero-fg);padding:20px 18px 18px}
.parade .bearbig{position:absolute;right:-30px;top:-20px;width:230px;opacity:.13;pointer-events:none}
.parade h2{font-family:var(--f-display);font-size:clamp(30px,7vw,46px);letter-spacing:.02em;line-height:1;font-weight:400}
.parade .kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0 18px;position:relative}
.parade .kpi{background:rgba(255,255,255,.1);border-radius:16px;padding:10px 12px}
.parade .kpi b{display:block;font-family:var(--f-display);font-size:34px;font-weight:400;line-height:1.05}
.parade .kpi span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.ready{height:10px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden;display:flex;margin-bottom:16px}
.ready i{display:block;height:100%}
.ranks{display:flex;flex-direction:column;gap:6px;position:relative}
.rank{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:end;padding-bottom:6px;border-bottom:2px solid rgba(255,243,241,.18);cursor:pointer;background:none;border-top:0;border-left:0;border-right:0;color:inherit;text-align:left}
.rank .nm{font-weight:800;font-size:13px;line-height:1.15}
.rank .nm b{display:block;font-family:var(--f-display);font-size:28px;font-weight:400;line-height:1}
.rank .units{display:flex;flex-wrap:wrap;gap:2px 4px;align-items:flex-end;min-height:30px}
.unit{position:relative;width:58px;color:var(--hero-fg)}
.unit svg{width:100%;height:auto;display:block}
.unit.limited{color:var(--brass)}
.unit.service{color:rgba(255,243,241,.32)}
.unit.empty{color:transparent}
.unit.empty svg *{stroke:rgba(255,243,241,.35);stroke-dasharray:3 3;fill:none}
.unit .wr{position:absolute;right:-2px;top:-6px;width:17px;height:17px;border-radius:50%;background:var(--svc-bg);color:var(--svc);display:grid;place-items:center}
.unit .wr svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.6}
@media (prefers-reduced-motion:no-preference){.unit{animation:rollin .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 45ms)}@keyframes rollin{from{transform:translateX(-26px);opacity:0}to{transform:none;opacity:1}}}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;font-weight:600;margin-top:12px;opacity:.9;position:relative}

/* ===== típus-oldal ===== */
.typehead{border-radius:26px;background:linear-gradient(150deg,var(--hero1),var(--hero2));color:var(--hero-fg);padding:18px;position:relative;overflow:hidden}
.typehead .sil{width:min(300px,70%);color:var(--hero-fg);opacity:.95;margin:4px 0 0 auto;display:block}
.typehead .sil svg{width:100%;height:auto;display:block}
.typehead h2{font-family:var(--f-display);font-size:clamp(34px,9vw,54px);font-weight:400;line-height:1;letter-spacing:.02em}
.typehead .meta{font-size:13px;opacity:.85;font-weight:600;margin-top:4px}
.counter{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.counter .big{font-family:var(--f-display);font-size:52px;line-height:1;min-width:2ch;text-align:center}
.counter button{width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:var(--hero-fg);font-size:26px;font-weight:700;cursor:pointer;display:grid;place-items:center}
.counter button.plus{background:var(--hero-fg);color:var(--accent-deep)}
.counter .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.readyrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.readyrow span{background:rgba(255,255,255,.14);border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:700}
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:14px}
@media (max-width:420px){.vlist{grid-template-columns:1fr}}
.vcard{background:var(--surface);border-radius:var(--r);padding:14px 14px 14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;box-shadow:0 1px 0 var(--line),0 4px 16px rgba(60,0,8,.05);position:relative;cursor:pointer;border:0;text-align:left;color:inherit;width:100%}
.vcard::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:5px;border-radius:0 5px 5px 0;background:var(--ok)}
.vcard.limited::before{background:var(--warn)} .vcard.service::before{background:var(--svc)}
.vcard .reg{font-family:var(--f-display);font-size:30px;line-height:1;letter-spacing:.03em;overflow-wrap:anywhere;font-weight:400}
.vcard .reg.blank{color:var(--muted);font-family:var(--f-body);font-weight:800;font-size:17px;line-height:1.3}
.vcard .line{grid-column:1/-1;display:flex;gap:4px 14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.vcard .line b{color:var(--fg);font-weight:700}
.vcard .pills{grid-column:1/-1}
.stbtn{border:0;border-radius:14px;padding:6px 10px;cursor:pointer;display:flex;align-items:center;gap:6px;font-weight:800;font-size:12px;letter-spacing:.02em;align-self:start}
.stbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2}
.stbtn.ok{background:var(--ok-bg);color:var(--ok)} .stbtn.limited{background:var(--warn-bg);color:var(--warn)} .stbtn.service{background:var(--svc-bg);color:var(--svc)}
.addcard{border:2px dashed var(--line);border-radius:var(--r);background:transparent;cursor:pointer;color:var(--muted);font-weight:800;min-height:96px;display:flex;align-items:center;justify-content:center;gap:8px}

/* ===== gép-lap ===== */
.vtop{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.vtop .back{border:0;background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:800;cursor:pointer;box-shadow:inset 0 0 0 1.5px var(--line)}
.vtop .arrow{width:42px;height:42px;border-radius:50%;border:0;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);cursor:pointer;font-size:22px;line-height:1;flex:none}
.vtop .arrow:disabled{opacity:.35;cursor:default}
.vtop .pos{margin-left:auto;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.hero{border-radius:26px;background:linear-gradient(150deg,var(--hero1),var(--hero2));color:var(--hero-fg);overflow:hidden;position:relative;touch-action:pan-y;user-select:none;padding:18px}
.hero .reg{font-family:var(--f-display);font-size:clamp(46px,13vw,80px);line-height:.95;letter-spacing:.03em;overflow-wrap:anywhere;font-weight:400}
.hero .tt{font-weight:700;opacity:.85;font-size:14px}
.hero .sil{width:min(320px,78%);margin:6px 0 0 auto;display:block;color:var(--hero-fg)}
.hero .sil svg{width:100%;height:auto;display:block}
.hero .facts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.hero .facts span{background:rgba(255,255,255,.14);border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600}
.hero .stbig{position:absolute;top:16px;right:16px}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
.quick button{border:0;background:var(--surface);border-radius:18px;padding:12px 4px;cursor:pointer;font-weight:800;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;box-shadow:0 1px 0 var(--line),0 4px 14px rgba(60,0,8,.05)}
.quick svg{width:24px;height:24px;stroke:var(--accent);fill:none;stroke-width:1.9}
.subtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px;padding-bottom:2px}
.subtabs button{border:0;background:transparent;border-radius:999px;padding:7px 13px;font-weight:800;font-size:13.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.subtabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.metric{background:var(--surface);border-radius:16px;padding:10px 12px;box-shadow:0 1px 0 var(--line)}
.metric .v{font-family:var(--f-mono);font-size:20px;font-weight:600}
.metric .v small{font-size:11px;color:var(--muted);font-weight:400;margin-left:3px}
.mlbox{border-radius:16px;padding:14px;background:var(--surface2)}
.mlbox .n{font-family:var(--f-display);font-size:34px;line-height:1;font-weight:400}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.ref{font-size:13px;color:var(--muted);border-left:3px solid var(--brass);padding-left:10px;margin-top:10px}
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.timeline li{position:relative;padding:0 0 12px 26px}
.timeline li::before{content:"";position:absolute;left:1px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--muted)}
.timeline li.fuel::before{border-color:var(--k)} .timeline li.move::before{border-color:var(--accent)}
.timeline .d{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
/* naptár */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-weight:800;font-size:11px;text-align:center;letter-spacing:.06em;color:var(--muted);padding:2px 0}
.cal .day{background:var(--surface);min-height:84px;padding:5px;cursor:pointer;border:0;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;color:inherit;border-radius:12px}
.cal .day.out{background:transparent;color:var(--muted)}
.cal .day .n{font-family:var(--f-mono);font-size:12px;font-weight:600}
.cal .day.today .n{background:var(--accent);color:var(--accent-fg);border-radius:6px;padding:0 5px;align-self:flex-start}
.cal .day[aria-pressed="true"]{box-shadow:inset 0 0 0 2.5px var(--accent)}
.cal .ev{font-size:10.5px;line-height:1.35;padding:0 5px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.cal .ev.place{background:var(--surface2);box-shadow:inset 0 0 0 1px var(--accent)}
.cal .ev.fuel{color:var(--surface);background:var(--k)}
.cal .ev.ml{color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.cal .more{font-size:10px;color:var(--muted);font-family:var(--f-mono)}
@media (max-width:560px){.cal{gap:2px}.cal .day{min-height:56px;border-radius:9px;padding:4px}.cal .ev{font-size:0;height:5px;padding:0;box-shadow:none}.cal .ev.place{background:var(--accent)}.cal .ev.ml{display:none}}
/* sofőrök */
.roster{display:flex;gap:8px;flex-wrap:wrap;padding:12px;border:2px dashed var(--line);border-radius:18px;min-height:60px;background:var(--surface)}
.roster.over,.slot.over{border-color:var(--accent);background:var(--bad-bg)}
.dchip{display:inline-flex;flex-direction:column;align-items:flex-start;gap:3px;background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:7px 13px;font-weight:800;font-size:14px;cursor:grab;touch-action:none;user-select:none;border:2px solid transparent}

.ghost{position:fixed;z-index:80;pointer-events:none;transform:translate(-50%,-60%) rotate(-4deg) scale(1.06);box-shadow:0 10px 26px rgba(60,0,8,.35)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.slot{border:2px dashed var(--line);border-radius:16px;padding:8px 6px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;background:var(--surface);min-height:72px;cursor:pointer}

.fstpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.fstpick label{cursor:pointer}.fstpick input{position:absolute;opacity:0;pointer-events:none}

.fstpick input:checked+span{background:var(--warn-bg);color:var(--warn);box-shadow:inset 0 0 0 2px var(--warn)}
.fstpick label.done input:checked+span{background:var(--ok-bg);color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.fstpick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.rqd{border-radius:12px;background:var(--surface2)}
.rqd summary{cursor:pointer;padding:8px 12px;font-weight:800;list-style:none;display:flex;align-items:center;gap:6px}
.rqd summary::-webkit-details-marker{display:none}
.rqd summary::before{content:'▸';transition:transform .2s;display:inline-block}.rqd[open] summary::before{transform:rotate(90deg)}
.rqdb{padding:0 12px 10px;display:flex;flex-direction:column;gap:10px}
.rqoh{font-weight:800;font-size:13px;margin-bottom:4px}.rqoh.add{color:var(--ok)}.rqoh.upd{color:var(--warn)}.rqoh.del{color:var(--bad)}
.rqt{width:100%;border-collapse:collapse;font-size:13.5px}

.rqt td{padding:3px 0;overflow-wrap:anywhere}.rqt tr+tr th,.rqt tr+tr td{border-top:1px dashed var(--line)}
.rqt tr.ch td b{color:var(--accent)}.rqt s{color:var(--muted)}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px}
.rqtl{list-style:none;margin:0;padding:0 0 0 4px;display:flex;flex-direction:column;gap:4px;font-size:13px}
.rqtl li{position:relative;padding-left:20px;color:var(--muted)}
.rqtl li::before{content:'';position:absolute;left:2px;top:4px;width:10px;height:10px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.rqtl li:not(:last-child)::after{content:'';position:absolute;left:7px;top:16px;bottom:-6px;width:2px;background:var(--line)}
.rqtl li.on{color:var(--fg)}.rqtl li.on::before{border-color:var(--accent);background:var(--accent)}
.rqtl li.on.ok::before{border-color:var(--ok);background:var(--ok)}.rqtl li.on.bad::before{border-color:var(--bad);background:var(--bad)}
.rqnote{width:100%;font:inherit;font-size:14px;padding:8px 12px;border-radius:12px}

function tkItems(v){const tk=v.tk||{},log=tk.log||[],out=[];if(v.type!=='pzh')return out;
  const lastOf=(pred)=>log.filter(pred).sort((a,b)=>a.date<b.date?1:-1)[0];
  const dateItem=(code,date,extra)=>{const left=diffDays(today(),date);return {code,date,left,st:left<-7?'bad':left<=14?'warn':'ok',...extra}};
  const F=tkTicks(v,TK_F,'F');
  if(F){const x=F.overdue||F.next;out.push({...dateItem(x.lvl,x.date,{grp:'F',tol:true}),overdue:!!F.overdue,upcoming:F.upcoming})}
  const G=tkTicks(v,TK_G,'GKA');
  if(G){const x=G.overdue||G.next;out.push({...dateItem(x.lvl,x.date,{grp:'G',tol:true}),overdue:!!G.overdue,upcoming:G.upcoming})}
  // GKA üzemóra-határok
  const cur=v.gkaH;if(cur!=null)TK_G.filter(g=>g[2]).forEach(([,code,H])=>{const last=lastOf(l=>l.code.startsWith('GKA')&&tkRank(l.code)>=tkRank(code));const base=last?.gkaH??tk.gkaStart??0;const left=H-(cur-base);
    out.push({grp:'GH',code,hoursLeft:left,unit:'GKA üó',st:left<0?'bad':left<=H*.1?'warn':'ok',limit:H})});
  // TW (motor üzemóra / 24 hónap)
  const mh=v.motorH;const tw1=lastOf(l=>l.code==='TW1'||l.code==='TW2'),tw2=lastOf(l=>l.code==='TW2');
  if(mh!=null||tk.delivery){const b1=tw1?.motorH??tk.twStart??0,d1=tw1?.date||tk.since||tk.delivery;const hl=mh!=null?300-(mh-b1):null;const dd=d1?addMonths(d1,24):null;const dl=dd?diffDays(today(),dd):null;
    out.push({grp:'TW',code:'TW1',hoursLeft:hl,unit:'motor üó',date:dd,left:dl,st:(hl!=null&&hl<0)||(dl!=null&&dl<0)?'bad':(hl!=null&&hl<=30)||(dl!=null&&dl<=30)?'warn':'ok'});
    const b2=tw2?.motorH??tk.twStart??0;const hl2=mh!=null?900-(mh-b2):null;out.push({grp:'TW',code:'TW2',hoursLeft:hl2,unit:'motor üó',st:hl2!=null&&hl2<0?'bad':hl2!=null&&hl2<=90?'warn':'ok'})}

  if(tk.delivery&&!log.some(l=>l.code==='E')){const dd=addDays(tk.delivery,182),dl=diffDays(today(),dd);const kl=v.km!=null?500-(v.km-(tk.deliveryKm||0)):null;

  return out}
function tkWorst(v){const r={bad:0,warn:1,ok:2};return tkItems(v).filter(i=>i.st!=='ok').sort((a,b)=>r[a.st]-r[b.st])[0]}

  if(p==='ev'){const y=pd(t).getFullYear();for(let i=4;i>=0;i--)out.push({s:(y-i)+'-01-01',e:(y-i+1)+'-01-01',l:String(y-i)})}
  return out}

function rqVal(k,x){if(x==null||x==='')return '–';
  if(k==='vid'){const v=S.vehicles[x];return v?esc(vLabel(v)):'?'}
  if(k==='driverId'){return x?esc(dName(S.drivers[x])||'?'):'nincs'}
  if(k==='tripId'){const t=S.trips[x];return t?'ML '+esc(t.num):'?'}
  if(k==='status')return esc((STATUS[x]||FST[x]||[x])[0]);
  if(k==='color')return `<span class="sw" style="background:${esc(x)}"></span>`;
  if(k==='fuel')return `${n0(x.l)} l`;
  if(k==='photos')return Array.isArray(x)?x.length+' db':'–';
  if(k==='log')return Array.isArray(x)&&x.length?`${x.length} bejegyzés · utolsó: ${esc((x[x.length-1].note)||'')}`:'–';
  if(k==='resolution')return esc(FRES[x]||x);
  if(k==='maint')return Array.isArray(x)?x.length+' ciklus':'–';

    case 'tripPhoto':photoAdd(S.trips[d.id]);break;
    case 'addMove':moveForm(d.vid||v?.id||(V.moveVid!=='all'?V.moveVid:null));break;case 'editMove':moveForm(null,S.moves[d.id]);break;
    case 'addEvent':eventForm(d.vid||v?.id||(V.calVid!=='all'?V.calVid:orderedVehicles()[0]?.id),d.date);break;case 'editEvent':eventForm(null,null,S.events[d.id]);break;
    case 'addMaint':maintForm(v);break;case 'editMaint':maintForm(v,(v.maint||[]).find(m=>m.id===d.id));break;
    case 'doneMaint':await upd('vehicles',v.id,{maint:(v.maint||[]).map(m=>m.id===d.id?{...m,lastDate:today(),lastH:v.h??m.lastH,lastKm:v.km??m.lastKm}:m)});toast('Elvégezve, mai állással');break;
    case 'copyMaint':{const o=byType(v.type).filter(x=>x.id!==v.id);if(!o.length){toast('Nincs másik ilyen típusú gép.');break}
      confirmBox('Ciklusok másolása',`${(v.maint||[]).length} ciklus átmásolása ${o.length} másik ${esc(TYPES[v.type].name)} gépre, mai dátummal és a gépek saját állásával. A meglévő ciklusaikat lecseréli.`,'Másolás',async()=>{for(const x of o)await upd('vehicles',x.id,{maint:(v.maint||[]).map(m=>({...m,id:uid(),lastDate:today(),lastH:x.h??null,lastKm:x.km??null}))});toast(`${o.length} gépre másolva`)});break}
    case 'addFault':faultForm(d.vid||v?.id);break;
    case 'faultSt':faultStatusForm(S.faults[d.id]);break;
    case 'faultNext':{const f=S.faults[d.id];await upd('faults',f.id,{status:f.status==='nyitott'?'javítás alatt':'lezárva'});break}
    case 'addDriver':driverForm();break;case 'editDriver':driverForm(S.drivers[d.id]);break;
    case 'unassign':await upd('vehicles',d.id,{driverId:null});toast('Levéve a gépről');break;
    case 'slotTap':if(V.selDriver)await assign(V.selDriver,el.dataset.drop);break;
  }})}catch(err){if(typeof err==='string')toast(err)}
});
document.addEventListener('input',e=>{if(e.target.id!=='archq')return;const q=e.target.value.trim().toLowerCase();document.querySelectorAll('#archlist [data-s]').forEach(x=>{x.hidden=!!q&&!x.dataset.s.includes(q)});document.querySelectorAll('#archlist .list').forEach(l=>{const any=[...l.children].some(c=>!c.hidden);l.hidden=!any;if(l.previousElementSibling)l.previousElementSibling.hidden=!any})});
document.addEventListener('change',e=>{if(e.target.id==='calVid'){V.calVid=e.target.value;render()}if(e.target.id==='moveVid'){V.moveVid=e.target.value;render()}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&$('#scrim')){closeModal();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-drag],.slot,.vcard')&&!$('#scrim')){e.preventDefault();e.target.click();return}
  if($('#scrim')||/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName||''))return;
  if(V.view==='flotta'){if(e.key==='ArrowRight'&&V.page<PAGES.length-1)goPage(V.page+1);if(e.key==='ArrowLeft'&&V.page>0)goPage(V.page-1)}
  if(V.view==='gep'){const v=S.vehicles[V.vid];const l=byType(v.type),i=l.findIndex(x=>x.id===V.vid);if(e.key==='ArrowRight'&&l[i+1])openVehicle(l[i+1].id,true);if(e.key==='ArrowLeft'&&l[i-1])openVehicle(l[i-1].id,true)}});
window.addEventListener('resize',()=>{const tr=$('#track');if(tr)tr.scrollLeft=V.page*tr.clientWidth});

/* ráhúzás és gép-lap lapozás */
let DRAG=null,SW=null;
function autoScroll(){if(!DRAG||!DRAG.moved)return;const edge=110,y=DRAG.cy,h=innerHeight;let dy=0;
  if(y<edge+40)dy=-Math.ceil((edge+40-y)/6);else if(y>h-edge-60)dy=Math.ceil((y-(h-edge-60))/6);
  if(dy){scrollBy(0,dy);const t=document.elementFromPoint(DRAG.cx,DRAG.cy)?.closest('[data-drop]')||null;if(DRAG.over!==t){DRAG.over?.classList.remove('over');t?.classList.add('over');DRAG.over=t}}
  DRAG.raf=requestAnimationFrame(autoScroll)}
document.addEventListener('pointerdown',e=>{
  if($('#scrim'))return;
  const c=e.target.closest('[data-drag]');
  if(c&&!e.target.closest('.x')&&!READONLY){DRAG={id:c.dataset.drag,x:e.clientX,y:e.clientY,src:c,moved:false,ghost:null,over:null};return}
  const h=e.target.closest('#hero');if(h&&!e.target.closest('button'))SW={x:e.clientX,y:e.clientY,h};
});
document.addEventListener('pointermove',e=>{
  if(DRAG){if(!DRAG.moved&&Math.hypot(e.clientX-DRAG.x,e.clientY-DRAG.y)>6){DRAG.moved=true;const g=DRAG.src.cloneNode(true);g.classList.add('ghost');g.removeAttribute('data-drag');document.body.appendChild(g);DRAG.ghost=g}
    if(DRAG.moved){e.preventDefault();DRAG.cy=e.clientY;DRAG.cx=e.clientX;if(!DRAG.raf)DRAG.raf=requestAnimationFrame(autoScroll);DRAG.ghost.style.left=e.clientX+'px';DRAG.ghost.style.top=e.clientY+'px';const t=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-drop]')||null;if(DRAG.over!==t){DRAG.over?.classList.remove('over');t?.classList.add('over');DRAG.over=t}}}
  else if(SW){const dx=e.clientX-SW.x;if(Math.abs(dx)>10&&Math.abs(e.clientY-SW.y)<40)SW.h.style.transform=`translateX(${dx*.35}px)`}
},{passive:false});
document.addEventListener('pointerup',async e=>{
  if(DRAG){const dr=DRAG;DRAG=null;if(dr.moved){justDragged=Date.now();dr.ghost?.remove();dr.over?.classList.remove('over');if(dr.over){try{await act(()=>assign(dr.id,dr.over.dataset.drop))}catch(x){if(typeof x==='string')toast(x)}}else render()}return}
  if(SW){const dx=e.clientX-SW.x,dy=e.clientY-SW.y;SW.h.style.transform='';SW=null;if(Math.abs(dx)>70&&Math.abs(dy)<50){justDragged=Date.now();const v=S.vehicles[V.vid];const l=byType(v.type),i=l.findIndex(x=>x.id===V.vid);const n=dx<0?l[i+1]:l[i-1];if(n)openVehicle(n.id,true)}}
});
document.addEventListener('pointercancel',()=>{if(DRAG){DRAG.ghost?.remove();DRAG.over?.classList.remove('over');DRAG=null}if(SW){SW.h.style.transform='';SW=null}});

render();
boot();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
